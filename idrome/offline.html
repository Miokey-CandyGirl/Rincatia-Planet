<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iDrome — 当前离线</title>
  <meta name="theme-color" content="#2C5F8A">
  <link rel="icon" type="image/jpeg" href="/idrome/assets/images/idrome_logo.jpg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8edf2 100%);
      color: #333;
    }
    .offline-container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .offline-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 1.5rem;
      display: block;
      box-shadow: 0 4px 16px rgba(44, 95, 138, 0.2);
    }
    .offline-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2C5F8A;
      margin-bottom: 0.5rem;
    }
    .offline-desc {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: #2C5F8A;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #1e4a6e;
    }
    .offline-hint {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <img src="/idrome/assets/images/idrome_logo.jpg" alt="iDrome" class="offline-logo"
         onerror="this.style.display='none'">
    <h1 class="offline-title">iDrome 当前离线</h1>
    <p class="offline-desc">
      网络连接已断开，AI 对话功能暂时不可用。<br>
      您仍可以浏览已缓存的历史对话。
    </p>
    <button class="retry-btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      重试连接
    </button>
    <p class="offline-hint">
      网络恢复后，输入的消息将自动同步到云端
    </p>
  </div>
</body>
</html>
