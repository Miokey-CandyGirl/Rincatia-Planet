<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>田语在线词典</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="icon" href="/flag_logo.png" type="image/png">
<!-- PWA Meta Tags -->
<link rel="manifest" href="/dictionary/manifest.json">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="田语词典">
<link rel="apple-touch-icon" href="/flag_logo.png">
<style>
/* ==========================================
   琳凯蒂亚语在线词典管理系统 — 全局样式
   ========================================== */
:root {
  --bg-primary: #0f0f1a;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --bg-input: rgba(255,255,255,0.06);
  --accent: #7b9fff;
  --accent-dim: rgba(123,159,255,0.15);
  --gold: #ffd700;
  --gold-dim: rgba(255,215,0,0.15);
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;
  --text: #e0e0e0;
  --text-secondary: #8888aa;
  --text-muted: #5a5a7a;
  --border: rgba(255,255,255,0.08);
  --border-focus: rgba(123,159,255,0.35);
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== 认证对话框（增删改时弹出，查询时不需要） ===== */
.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  backdrop-filter: blur(4px);
}

.auth-box {
  position: relative;
  background: #16162a;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2rem;
  width: 90%;
  max-width: 380px;
  text-align: center;
  box-shadow: var(--shadow);
}

.auth-box .auth-close {
  position: absolute;
  top: 0.6rem;
  right: 0.6rem;
  width: 28px; height: 28px;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
  color: var(--text-muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}

.auth-box .auth-close:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

.auth-box .auth-logo {
  margin-bottom: 1rem;
}

.auth-box .auth-logo svg { width: 48px; height: 48px; }

.auth-box h2 {
  font-size: 1.15rem;
  color: var(--gold);
  margin-bottom: 0.5rem;
}

.auth-box .auth-desc {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}

.auth-box .auth-input-group {
  display: flex;
  gap: 0.5rem;
}

.auth-box .auth-input-group input {
  flex: 1;
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.9rem;
  font-family: var(--font);
  outline: none;
  transition: border-color var(--transition);
}

.auth-box .auth-input-group input:focus { border-color: var(--border-focus); }

.auth-box .auth-input-group input::placeholder { color: var(--text-muted); }

.auth-box .auth-error {
  color: var(--danger);
  font-size: 0.8rem;
  margin-top: 0.6rem;
  min-height: 1.2em;
}

/* ===== 加载中覆盖层（小游戏） ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  backdrop-filter: blur(4px);
}
.loading-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem 2rem;
  text-align: center;
  max-width: 460px;
  width: 90%;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.loading-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  font-size: 1.1rem;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 0.3rem;
}
.loading-hint {
  color: var(--text-muted);
  font-size: 0.82rem;
  margin-bottom: 0.8rem;
}
.loading-game-area {
  background: #0d0f17;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  display: inline-block;
  line-height: 0;
}
.loading-game-area canvas {
  display: block;
  cursor: crosshair;
}
.loading-game-info {
  display: flex;
  justify-content: space-between;
  margin-top: 0.8rem;
  font-size: 0.9rem;
  color: var(--text);
}
.loading-game-info strong {
  color: var(--gold);
}

/* ===== 顶部导航 ===== */
.app-header {
  background: linear-gradient(180deg, rgba(123,159,255,0.12) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}

.header-logo svg { width: 28px; height: 28px; }

.header-nav {
  display: flex;
  gap: 0.25rem;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 0.25rem;
}

.nav-tab {
  padding: 0.45rem 1rem;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-tab.active {
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 600;
}

/* ===== 主容器 ===== */
.app-main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* ===== 工具栏 ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.2rem;
  flex-wrap: wrap;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem 0.8rem;
  flex: 1;
  min-width: 200px;
  transition: border-color var(--transition);
}

.search-box:focus-within { border-color: var(--border-focus); }

.search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }

.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.9rem;
  font-family: var(--font);
  outline: none;
}

.search-box input::placeholder { color: var(--text-muted); }

.filter-select {
  padding: 0.5rem 0.8rem;
  border-radius: var(--radius);
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.85rem;
  font-family: var(--font);
  cursor: pointer;
  min-width: 120px;
  transition: border-color var(--transition);
}

.filter-select:focus { border-color: var(--border-focus); outline: none; }
.filter-select option { background: #1a1a2e; color: var(--text); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  font-size: 0.85rem;
  font-family: var(--font);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent-dim);
  border-color: var(--border-focus);
  color: var(--accent);
}

.btn-primary:hover { background: rgba(123,159,255,0.25); }

.btn-danger {
  background: rgba(248,113,113,0.1);
  border-color: rgba(248,113,113,0.2);
  color: var(--danger);
}

.btn-danger:hover { background: rgba(248,113,113,0.2); }

.btn-sm {
  padding: 0.3rem 0.6rem;
  font-size: 0.78rem;
  border-radius: var(--radius-sm);
}

.btn-icon {
  padding: 0.35rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
}

.btn-icon:hover { color: var(--text); border-color: var(--border-focus); background: var(--bg-card-hover); }
.btn-icon.danger:hover { color: var(--danger); border-color: rgba(248,113,113,0.3); }

/* ===== 数据表格 ===== */
.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-scroll { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

thead { background: rgba(255,255,255,0.03); }

th {
  padding: 0.75rem 0.8rem;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}

td {
  padding: 0.65rem 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.cell-word { font-weight: 600; color: var(--gold); }
.cell-ipa { color: var(--text-secondary); font-style: italic; font-size: 0.82rem; }
.cell-actions { display: flex; gap: 0.3rem; }

.pos-badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
}

/* 词类融入释义后的内联样式 */
.pos-inline {
  display: inline;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent);
  margin-right: 0.15rem;
}

.pos-noun  { background: rgba(59,130,246,0.2);  color: #60a5fa; }
.pos-verb  { background: rgba(34,197,94,0.2);   color: #4ade80; }
.pos-adj   { background: rgba(168,85,247,0.2);  color: #c084fc; }
.pos-adv   { background: rgba(251,146,60,0.2);  color: #fb923c; }
.pos-pron  { background: rgba(45,212,191,0.2);  color: #2dd4bf; }
.pos-conj  { background: rgba(244,114,182,0.2); color: #f472b6; }
.pos-num   { background: rgba(239,68,68,0.2);   color: #f87171; }
.pos-excl  { background: rgba(129,140,248,0.2); color: #818cf8; }
.pos-int  { background: rgba(251,191,36,0.2);  color: #fbbf24; }
.pos-exp   { background: rgba(251,113,133,0.2); color: #fb7185; }

/* ===== 分页 ===== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 1rem;
  font-size: 0.82rem;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
}

.pagination-info { flex-shrink: 0; }

.pagination-btns {
  display: flex;
  gap: 0.4rem;
  align-items: center;
}

.pagination-btns button {
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--transition);
}

.pagination-btns button:hover:not(:disabled) {
  border-color: var(--border-focus);
  color: var(--text);
}

.pagination-btns button:disabled { opacity: 0.3; cursor: default; }
.pagination-btns button.active { background: var(--accent-dim); border-color: var(--border-focus); color: var(--accent); }

/* ===== 语法编辑面板 ===== */
.grammar-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  flex-wrap: wrap;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.6rem 0.9rem;
  margin-bottom: 1rem;
}

.grammar-topbar .topbar-tip {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.grammar-topbar .btn-book {
  text-decoration: none;
  flex-shrink: 0;
}

/* 顶栏右侧链接组：百科入口 + 下载按钮 */
.grammar-topbar .topbar-links {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.grammar-topbar .baike-link {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
  transition: color var(--transition);
  white-space: nowrap;
}

.grammar-topbar .baike-link:hover {
  color: var(--accent);
}

.grammar-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1rem;
  min-height: 60vh;
}

.grammar-sidebar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
}

.grammar-list {
  flex: 1;
  overflow-y: auto;
  max-height: 50vh;
}

.grammar-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.55rem 0.7rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  color: var(--text-secondary);
  font-size: 0.85rem;
  margin-bottom: 0.15rem;
}

.grammar-item:hover { background: var(--bg-card-hover); color: var(--text); }
.grammar-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

.grammar-item .del-icon {
  opacity: 0;
  transition: opacity var(--transition);
  flex-shrink: 0;
  margin-left: 0.3rem;
}

.grammar-item:hover .del-icon { opacity: 0.6; }
.grammar-item .del-icon:hover { opacity: 1; color: var(--danger); }

.grammar-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 45vh;
}

.grammar-panel-header {
  padding: 0.6rem 0.8rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.grammar-panel-header input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.9rem;
  font-family: var(--font);
  font-weight: 600;
  outline: none;
}

.grammar-panel-header input::placeholder { color: var(--text-muted); }

.grammar-editor {
  flex: 1;
  padding: 0;
  display: flex;
}

.grammar-editor textarea {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.88rem;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  line-height: 1.7;
  padding: 1rem;
  resize: none;
  outline: none;
}

.grammar-preview {
  grid-column: 1 / -1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  overflow-y: auto;
  max-height: 80vh;
}

.grammar-preview h1, .grammar-preview h2, .grammar-preview h3 {
  color: var(--gold);
  margin: 0.8em 0 0.4em;
}

.grammar-preview h1:first-child, .grammar-preview h2:first-child, .grammar-preview h3:first-child { margin-top: 0; }

.grammar-preview table {
  border-collapse: collapse;
  margin: 0.8em 0;
}

.grammar-preview th, .grammar-preview td {
  border: 1px solid var(--border);
  padding: 0.4rem 0.7rem;
  font-size: 0.85rem;
}

.grammar-preview th { background: rgba(255,255,255,0.05); }

.grammar-preview code {
  background: rgba(123,159,255,0.12);
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: 0.85em;
  color: var(--accent);
}

.grammar-preview pre {
  background: rgba(0,0,0,0.3);
  padding: 0.8rem 1rem;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 0.6em 0;
}

.grammar-preview pre code { background: none; padding: 0; color: var(--text); }

.grammar-preview blockquote {
  border-left: 3px solid var(--gold);
  padding-left: 1rem;
  margin: 0.6em 0;
  color: var(--text-secondary);
}

.grammar-preview ul, .grammar-preview ol { padding-left: 1.5rem; margin: 0.4em 0; }

.grammar-actions {
  padding: 0.6rem 0.8rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.5rem;
}

/* 语法编辑格式工具栏 */
.grammar-toolbar {
  display: flex;
  gap: 0.2rem;
  padding: 0.4rem 0.8rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  background: rgba(255,255,255,0.02);
}

.grammar-toolbar button {
  width: 30px; height: 30px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-family: var(--font);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  font-weight: 600;
}

.grammar-toolbar button:hover {
  background: var(--bg-card-hover);
  border-color: var(--border);
  color: var(--text);
}

.grammar-toolbar .tb-sep {
  width: 1px;
  background: var(--border);
  margin: 0 0.3rem;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: #16162a;
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 90%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slideUp 0.25s ease;
}

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.2rem;
  border-bottom: 1px solid var(--border);
}

.modal-header h3 { font-size: 1.05rem; color: var(--gold); }

.modal-close {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: transparent;
  color: var(--text-secondary);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}

.modal-close:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

.modal-body { padding: 1.2rem; }

.form-group { margin-bottom: 1rem; }

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 0.35rem;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.55rem 0.7rem;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.88rem;
  font-family: var(--font);
  transition: border-color var(--transition);
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--border-focus); }

.form-group textarea { min-height: 80px; resize: vertical; }

.form-group .field-hint {
  font-size: 0.72rem;
  color: var(--text-muted);

    window._authResolve = resolve
  })
}

async function handleAuth() {
  const password = document.getElementById('authPassword').value.trim()
  const errorEl = document.getElementById('authError')
  const btnEl = document.getElementById('authBtn')

  if (!password) {
    errorEl.textContent = '请输入口令'
    return
  }

  btnEl.disabled = true
  btnEl.textContent = '验证中...'
  errorEl.textContent = ''

  try {
    // 使用 Supabase Auth 验证口令（邮箱固定，口令由用户输入）
    const { error } = await db.auth.signInWithPassword({
      email: ADMIN_EMAIL,
      password: password
    })

    if (error) {
      if (error.message.includes('Invalid login') || error.message.includes('invalid')) {
        errorEl.textContent = '口令错误，请重试'
      } else {
        errorEl.textContent = '验证失败: ' + error.message
      }
      btnEl.disabled = false
      btnEl.textContent = '验证'
      return
    }

    // 验证成功：关闭认证对话框，并重新加载数据（确保认证后数据立即可见）
    authOverlay.style.display = 'none'

  } catch (e) {
    errorEl.textContent = '网络错误，请检查连接'
    btnEl.disabled = false
    btnEl.textContent = '验证'
  }
}

// ---- 数据加载 ----
// Supabase 默认 select 限制 1000 条，使用 range 分批获取全部数据
async function fetchAll(table, orderCol = 'code') {
  const PAGE = 1000
  let all = []
  let from = 0
  while (true) {
    const to = from + PAGE - 1
    const { data, error } = await db.from(table).select('*').order(orderCol).range(from, to)
    if (error) throw error
    if (!data || data.length === 0) break
    all = all.concat(data)
    if (data.length < PAGE) break
    from += PAGE
  }
  return all
}

function startLoadingGame() {
  const canvas = document.getElementById('loadingCanvas')
  if (!canvas) return
  gameScore = 0
  gameLives = 3
  gameWords = []
  gameFrame = 0
  gameRunning = true
  updateGameUI()
  document.getElementById('loadingOverlay').style.display = 'flex'

  canvas.addEventListener('click', onGameClick)
  canvas.addEventListener('touchstart', onGameTouch, { passive: false })
  gameLoop()
}

function stopLoadingGame() {
  gameRunning = false
  if (gameAnimationId) { cancelAnimationFrame(gameAnimationId); gameAnimationId = null }
  const canvas = document.getElementById('loadingCanvas')
  if (canvas) {
    canvas.removeEventListener('click', onGameClick)
    canvas.removeEventListener('touchstart', onGameTouch)
  }
  document.getElementById('loadingOverlay').style.display = 'none'
}

function onGameClick(e) {
  if (!gameRunning) return
  const canvas = document.getElementById('loadingCanvas')
  const rect = canvas.getBoundingClientRect()
  const scaleX = canvas.width / rect.width
  const scaleY = canvas.height / rect.height
  const mx = (e.clientX - rect.left) * scaleX
  const my = (e.clientY - rect.top) * scaleY
  checkHit(mx, my)
}

function onGameTouch(e) {
  if (!gameRunning) return
  e.preventDefault()
  const canvas = document.getElementById('loadingCanvas')
  const rect = canvas.getBoundingClientRect()
  const scaleX = canvas.width / rect.width
  const scaleY = canvas.height / rect.height
  const touch = e.touches[0]
  const mx = (touch.clientX - rect.left) * scaleX
  const my = (touch.clientY - rect.top) * scaleY
  checkHit(mx, my)
}

function checkHit(mx, my) {
  for (let i = gameWords.length - 1; i >= 0; i--) {
    const w = gameWords[i]
    const ctx = document.getElementById('loadingCanvas').getContext('2d')
    ctx.font = 'bold 16px "Noto Sans SC", sans-serif'
    const metrics = ctx.measureText(w.text)
    const tw = metrics.width + 16
    const th = 28
    const tx = w.x - tw / 2
    const ty = w.y - th / 2
    if (mx >= tx && mx <= tx + tw && my >= ty && my <= ty + th) {
      gameWords.splice(i, 1)
      gameScore += 10
      updateGameUI()
      return
    }
  }
}

function updateGameUI() {
  document.getElementById('gameScore').textContent = gameScore
  const livesEl = document.getElementById('gameLives')
  let hearts = ''
  for (let i = 0; i < 3; i++) hearts += i < gameLives ? '❤️' : '🖤'
  livesEl.textContent = hearts
}

function gameLoop() {
  if (!gameRunning) return
  const canvas = document.getElementById('loadingCanvas')
  const ctx = canvas.getContext('2d')
  const W = canvas.width, H = canvas.height

  // 背景
  ctx.fillStyle = '#0d0f17'
  ctx.fillRect(0, 0, W, H)

  // 星空粒子
  ctx.fillStyle = 'rgba(123,159,255,0.3)'
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137 + gameFrame * (i % 3 + 1)) % W
    const sy = (i * 73 + gameFrame * 0.3) % H
    ctx.fillRect(sx, sy, 1.5, 1.5)
  }

  // 生成词汇
  if (gameFrame % 50 === 0 && gameWords.length < 8) {
    const text = GAME_WORDS[Math.floor(Math.random() * GAME_WORDS.length)]
    gameWords.push({
      text,
      x: 30 + Math.random() * (W - 60),
      y: -20,
      speed: 0.5 + Math.random() * 1.2
    })
  }

  // 绘制 & 移动词汇
  ctx.font = 'bold 16px "Noto Sans SC", sans-serif'
  for (let i = gameWords.length - 1; i >= 0; i--) {
    const w = gameWords[i]
    w.y += w.speed
    const metrics = ctx.measureText(w.text)
    const tw = metrics.width + 16, th = 28
    const tx = w.x - tw / 2, ty = w.y - th / 2

    // 绘制词汇气泡
    ctx.fillStyle = 'rgba(255,215,0,0.15)'
    ctx.strokeStyle = 'rgba(255,215,0,0.5)'
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.roundRect(tx, ty, tw, th, 14)
    ctx.fill()
    ctx.stroke()

    ctx.fillStyle = '#ffd700'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText(w.text, w.x, w.y)

    // 掉出底部
    if (w.y > H + 20) {
      gameWords.splice(i, 1)
      gameLives--
      updateGameUI()
      if (gameLives <= 0) {
        gameRunning = false
        // 游戏结束画面
        ctx.fillStyle = 'rgba(0,0,0,0.7)'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = '#ffd700'
        ctx.font = 'bold 22px "Noto Sans SC", sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('游戏结束！', W / 2, H / 2 - 20)
        ctx.fillStyle = '#fff'
        ctx.font = '16px "Noto Sans SC", sans-serif'
        ctx.fillText('得分：' + gameScore + '  数据加载完成后自动退出', W / 2, H / 2 + 20)
        updateGameUI()
        setTimeout(() => {
          if (gameRunning) return
          startLoadingGame()
        }, 2000)
        return
      }
    }
  }

  gameFrame++
  gameAnimationId = requestAnimationFrame(gameLoop)
}

async function initData() {
  startLoadingGame()
  await Promise.all([loadClassicWords(), loadBorrowingWords(), loadRoots(), loadGrammar(), loadFiniteWords(), loadLastModifiedTime()])
  stopLoadingGame()
  render()
}

// ---- 过滤数据 ----
function filteredClassic() {
  let list = state.classicWords
  if (state.classicSearch) {
    const s = state.classicSearch.toLowerCase()
    list = list.filter(w => (w.code || '').toLowerCase().includes(s) || (w.word || '').toLowerCase().includes(s) || (w.meaning || '').includes(s) || (w.pronunciation || '').includes(s) || (w.part_of_speech || '').includes(s))
  }
  return list
}

function filteredBorrowing() {
  let list = state.borrowingWords
  if (state.borrowingSearch) {
    const s = state.borrowingSearch.toLowerCase()
    list = list.filter(w => (w.code || '').toLowerCase().includes(s) || (w.word || '').toLowerCase().includes(s) || (w.meaning || '').includes(s) || (w.pronunciation || '').includes(s) || (w.part_of_speech || '').includes(s))
  }
  return list
}

function filteredFinite() {
  let list = state.finiteWords
  if (state.finiteSearch) {
    const s = state.finiteSearch.toLowerCase()
    list = list.filter(w =>
      (w.code || '').toLowerCase().includes(s) ||
      (w.word || '').toLowerCase().includes(s) ||
      (w.meaning || '').includes(s) ||
      (w.pronunciation || '').includes(s) ||
      (w.notes || '').includes(s) ||
      (w.part_of_speech || '').toLowerCase().includes(s) ||
      (FINITE_POS_LABELS[w.part_of_speech] || '').includes(s)
    )
  }
  return list
}

function filteredRoots() {
  let list = state.roots
  if (state.rootsFilterCategory) {
    list = list.filter(r => (r.category || '') === state.rootsFilterCategory)
  }
  if (state.rootsSearch) {
    const s = state.rootsSearch.toLowerCase()
    list = list.filter(r => {
      // 搜索编码、形读词根、音读词根、核心义
      if ((r.code || '').toLowerCase().includes(s)) return true
      if ((r.core_meaning || '').includes(s)) return true
      if ((r.form_root || '').includes(s)) return true
      if ((r.sound_root || '').includes(s)) return true
      if ((r.category || '').includes(s)) return true
      // 搜索派生词
      let derivs = []
      try { derivs = JSON.parse(r.derivatives || '[]') } catch {}
      return derivs.some(d => (d.word || '').toLowerCase().includes(s) || (d.meaning || '').includes(s) || (d.pos || '').toLowerCase().includes(s))
    })
  }
  return list
}

// ---- 分页工具 ----
function paginate(list, page) {
  const total = list.length
  const totalPages = Math.ceil(total / PAGE_SIZE)
  const start = (page - 1) * PAGE_SIZE
  const pageData = list.slice(start, start + PAGE_SIZE)
  return { total, totalPages, pageData, start }
}

function renderPagination(p, pageRef, onPageChange) {
  // 存储回调供全局 handlePaginationClick 使用
  state.paginationCallback = onPageChange
  let html = `<div class="pagination">`
  html += `<span class="pagination-info">共 ${p.total} 条，第 ${pageRef} / ${p.totalPages || 1} 页</span>`
  html += `<div class="pagination-btns">`
  html += `<button ${pageRef <= 1 ? 'disabled' : ''} onclick="handlePaginationClick(1)">首页</button>`
  html += `<button ${pageRef <= 1 ? 'disabled' : ''} onclick="handlePaginationClick(${pageRef - 1})">上一页</button>`
  for (let i = Math.max(1, pageRef - 2); i <= Math.min(p.totalPages, pageRef + 2); i++) {
    html += `<button class="${i === pageRef ? 'active' : ''}" onclick="handlePaginationClick(${i})">${i}</button>`
  }
  html += `<button ${pageRef >= p.totalPages ? 'disabled' : ''} onclick="handlePaginationClick(${pageRef + 1})">下一页</button>`
  html += `<button ${pageRef >= p.totalPages ? 'disabled' : ''} onclick="handlePaginationClick(${p.totalPages})">末页</button>`
  html += `</div></div>`
  return html
}

function handlePaginationClick(page) {
  if (state.paginationCallback) state.paginationCallback(page)
}

// ---- 词汇表格渲染（仅渲染表格+分页，不包含工具栏，解决搜索时焦点丢失的 bug）----
function renderWordTable(type) {
  const isClassic = type === 'classic'
  const words = isClassic ? filteredClassic() : filteredBorrowing()
  const pageRef = isClassic ? state.classicPage : state.borrowingPage
  const p = paginate(words, pageRef)

  if (pageRef > p.totalPages && p.totalPages > 0) {
    if (isClassic) state.classicPage = p.totalPages
    else state.borrowingPage = p.totalPages
    return renderWordTable(type)
  }

  let html = ''
  if (p.pageData.length === 0) {
    html += `<div class="empty-state">
      <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" stroke-width="2"/><line x1="14" y1="20" x2="34" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="14" y1="26" x2="30" y2="26" stroke="currentColor" stroke-width="1.5"/></svg>
      <p>暂无词条数据</p>
    </div>`
    const target = document.getElementById('tableArea' + type)
    if (target) target.innerHTML = html
    return
  }

  html += `<div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      <th>#</th><th>编码</th><th>词语</th><th>音标</th><th>释义</th><th>备注</th><th>操作</th>
    </tr></thead><tbody>`

  p.pageData.forEach((w, idx) => {
    // 词类融入释义，格式如：n. 学习；v. 教
    const posText = w.part_of_speech ? `<span class="pos-inline">${esc(w.part_of_speech)}</span> ` : ''
    html += `<tr onclick="showWordDetail('${type}', ${w.id})" style="cursor:pointer">
      <td style="color:var(--text-muted);font-size:0.8rem">${p.start + idx + 1}</td>
      <td style="color:var(--accent);font-weight:600;font-size:0.82rem">${esc(w.code || '')}</td>
      <td class="cell-word">${esc(w.word)}</td>
      <td class="cell-ipa">${esc(w.pronunciation || '')}</td>
      <td>${posText}${esc(w.meaning)}</td>
      <td style="color:var(--text-muted);font-size:0.78rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.notes || '')}</td>
      <td><div class="cell-actions">
        <button class="btn-icon" title="编辑" onclick="event.stopPropagation();openWordModal('${type}', ${w.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn-icon danger" title="删除" onclick="event.stopPropagation();deleteWord('${type}', ${w.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div></td>
    </tr>`
  })

  html += `</tbody></table></div></div>`
  html += renderPagination(p, pageRef, (newPage) => {
    if (isClassic) state.classicPage = newPage
    else state.borrowingPage = newPage
    renderWordTable(type)
  })

  const target = document.getElementById('tableArea' + type)
  if (target) target.innerHTML = html
}

// ---- 词根表格渲染（仅渲染表格+分页）----
function renderRootsTable() {
  const words = filteredRoots()
  const p = paginate(words, state.rootsPage)
  if (state.rootsPage > p.totalPages && p.totalPages > 0) { state.rootsPage = p.totalPages; return renderRootsTable() }

  let html = ''

  if (p.pageData.length === 0) {
    html += `<div class="empty-state"><svg viewBox="0 0 48 48" fill="none"><rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" stroke-width="2"/><line x1="14" y1="20" x2="34" y2="20" stroke="currentColor" stroke-width="1.5"/></svg><p>暂无词根数据</p></div>`
    const target = document.getElementById('tableAreaRoots')
    if (target) target.innerHTML = html
    return
  }

  html += `<div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr><th>#</th><th>编码</th><th>音读词根</th><th>形读词根</th><th>核心义</th><th>类别</th><th>音读派生词</th><th>操作</th></tr></thead><tbody>`

  // 检测重复：音读词根、形读词根、核心义（同一值出现 ≥2 次时高亮）
  const countMap = { sound: {}, form: {}, meaning: {} }
  p.pageData.forEach(r => {
    const s = (r.sound_root || '').toLowerCase()
    const f = (r.form_root || '').toLowerCase()
    const m = (r.core_meaning || '').toLowerCase()
    if (s) countMap.sound[s] = (countMap.sound[s] || 0) + 1
    if (f) countMap.form[f] = (countMap.form[f] || 0) + 1
    if (m) countMap.meaning[m] = (countMap.meaning[m] || 0) + 1
  })
  const dupSounds = new Set(Object.keys(countMap.sound).filter(k => countMap.sound[k] > 1))
  const dupForms = new Set(Object.keys(countMap.form).filter(k => countMap.form[k] > 1))
  const dupMeanings = new Set(Object.keys(countMap.meaning).filter(k => countMap.meaning[k] > 1))

  p.pageData.forEach((r, idx) => {
    let derivs = []
    try { derivs = JSON.parse(r.derivatives || '[]') } catch {}
    const derivText = derivs.map(d => `${d.word} ${d.pos}${d.meaning}`).join(' | ')
    const isSoundDup = dupSounds.has((r.sound_root || '').toLowerCase())
    const isFormDup = dupForms.has((r.form_root || '').toLowerCase())
    const isMeaningDup = dupMeanings.has((r.core_meaning || '').toLowerCase())
    const isAnyDup = isSoundDup || isFormDup || isMeaningDup
    html += `<tr onclick="showRootDetail(${r.id})" style="cursor:pointer${isAnyDup ? ';background:var(--gold-dim)' : ''}">
      <td style="color:var(--text-muted);font-size:0.8rem">${p.start + idx + 1}</td>
      <td style="color:var(--accent);font-weight:600">${esc(r.code)}</td>
      <td class="cell-word"${isSoundDup ? ' style="color:var(--gold);font-weight:700"' : ''}>${esc(r.sound_root)}</td>
      <td class="cell-ipa"${isFormDup ? ' style="color:var(--gold);font-weight:700"' : ''}>${esc(r.form_root || '')}</td>
      <td${isMeaningDup ? ' style="color:var(--gold);font-weight:700"' : ''}>${esc(r.core_meaning)}</td>
      <td style="color:var(--accent);font-size:0.85rem">${esc(r.category || '')}</td>
      <td style="color:var(--text-secondary);font-size:0.8rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(derivText)}</td>
      <td><div class="cell-actions">
        <button class="btn-icon" title="编辑" onclick="event.stopPropagation();openRootModal(${r.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn-icon danger" title="删除" onclick="event.stopPropagation();deleteRoot(${r.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div></td>
    </tr>`
  })

  html += `</tbody></table></div></div>`
  html += renderPagination(p, state.rootsPage, (newPage) => { state.rootsPage = newPage; renderRootsTable() })

  const target = document.getElementById('tableAreaRoots')
  if (target) target.innerHTML = html
}

  const isClassic = type === 'classic'
  const label = isClassic ? '古典' : '借词'
  const searchVal = isClassic ? state.classicSearch : state.borrowingSearch
  const totalCount = isClassic ? state.classicWords.length : state.borrowingWords.length

  let html = ''

  // 工具栏：搜索框 + 新增按钮（词类下拉筛选已取消，词类融入释义中）
  html += `<div class="toolbar" id="toolbar${type}">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="搜索编码、词语、音标、释义（含词性）..." id="search${type}" value="${esc(searchVal)}">
    </div>
    <div style="display:flex;gap:0.5rem">
      <button class="btn" onclick="confirmExport('${type}')">📥 导出</button>
      <button class="btn btn-primary" onclick="openWordModal('${type}', null)">+ 新增${label}词汇</button>
    </div>
  </div>`

  // 表格区域（独立更新，不重新渲染工具栏）
  html += `<div id="tableArea${type}"></div>`

  const containerId = isClassic ? 'tabClassic' : 'tabBorrowing'
  document.getElementById(containerId).innerHTML = html

  // 绑定搜索事件（使用 addEventListener，不会因 re-render 丢失）
  bindSearchEvents(type)

  // 渲染表格
  renderWordTable(type)
}

// 绑定搜索事件（只绑定一次，用 _bound 标记防止重复绑定）
function bindSearchEvents(type) {
  const searchInput = document.getElementById('search' + type)

  if (searchInput && !searchInput._bound) {
    searchInput._bound = true
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value
      if (type === 'classic') { state.classicSearch = val; state.classicPage = 1 }
      else { state.borrowingSearch = val; state.borrowingPage = 1 }
      renderWordTable(type)  // 仅更新表格，不重新渲染工具栏
    })
  }
}

// 检测编码/词语/词根是否与已有数据重复（新增时检查全部，编辑时排除自身 id）
function checkDuplicate(type, field, value, excludeId) {
  let list
  if (type === 'classic') list = state.classicWords
  else if (type === 'borrowing') list = state.borrowingWords
  else if (type === 'roots') list = state.roots
  else if (type === 'finite') list = state.finiteWords
  else return null

  return list.find(item => {
    if (excludeId && item.id === excludeId) return false
    const itemVal = (item[field] || '').toString().toLowerCase()
    return itemVal === value.toLowerCase()
  })
}

// 整合四类数据：标准词根派生词 + 古典词表 + 已收借词 + 有限词表
function buildAllwordsList() {
  const list = []

  // 1. 标准词根的所有派生词（编码为词根编码）
  state.roots.forEach(r => {
    let derivs = []
    try { derivs = JSON.parse(r.derivatives || '[]') } catch {}
    derivs.forEach(d => {
      if (d.word) {
        list.push({
          code: r.code || '',
          word: d.word,
          meaning: (d.pos ? d.pos + ' ' : '') + (d.meaning || ''),
          source: 'roots'
        })
      }
    })
  })

  // 2. 古典词表
  state.classicWords.forEach(w => {
    list.push({
      code: w.code || '',
      word: w.word || '',
      meaning: (w.part_of_speech ? w.part_of_speech + ' ' : '') + (w.meaning || ''),
      source: 'classic'
    })
  })

  // 3. 已收借词
  state.borrowingWords.forEach(w => {
    list.push({
      code: w.code || '',
      word: w.word || '',
      meaning: (w.part_of_speech ? w.part_of_speech + ' ' : '') + (w.meaning || ''),
      source: 'borrowing'
    })
  })

  // 4. 有限词表
  state.finiteWords.forEach(w => {
    list.push({
      code: w.code || '',
      word: w.word || '',
      meaning: (w.part_of_speech ? w.part_of_speech + ' ' : '') + (w.meaning || ''),
      source: 'finite'
    })
  })

  // 在全量数据上预计算重复编码后缀，确保后缀固定不随筛选变化
  const codeCount = {}
  list.forEach(item => {
    const c = (item.code || '').toLowerCase()
    if (!codeCount[c]) { codeCount[c] = { count: 0, items: [] } }
    codeCount[c].count++
    codeCount[c].items.push(item)
  })
  Object.values(codeCount).forEach(group => {
    if (group.count > 1) {
      group.items.forEach((item, i) => {
        item._codeDisplay = item.code + '-' + (i + 1)
      })
    }
  })

  return list
}

// 将释义中的词性部分转为斜体灰色 HTML
function formatMeaningPOS(meaning) {
  // 匹配已知词性前缀（英文缩写 + 中文）
  const knownPOS = [
    'n\\.', 'v\\.', 'adj\\.', 'adv\\.', 'pron\\.', 'num\\.', 'conj\\.', 'ind\\.', 'exp\\.', 'rel\\.',
    '名词', '动词', '形容词', '副词', '代词', '连词', '数词', '声叹词', '示词', '抒情词'
  ]
  const pattern = new RegExp('^(' + knownPOS.join('|') + ')\\s+')
  const match = meaning.match(pattern)
  if (match) {
    const pos = match[1]
    const rest = meaning.slice(match[0].length)
    return `<span style="font-style:italic;color:var(--text-muted)">${esc(pos)}</span> ${esc(rest)}`
  }
  return esc(meaning)
}

function renderAllwordsListTable() {
  const allItems = buildAllwordsList()

  // 搜索过滤
  let filtered = allItems
  if (state.allwordsSearch) {
    const s = state.allwordsSearch.toLowerCase()
    filtered = allItems.filter(item =>
      (item.code || '').toLowerCase().includes(s) ||
      (item.word || '').toLowerCase().includes(s) ||
      (item.meaning || '').includes(s)
    )
  }

  // 来源筛选：有限词 / 无限词
  if (state.allwordsFilter === 'finite') {
    filtered = filtered.filter(item => item.source === 'finite')
  } else if (state.allwordsFilter === 'infinite') {
    filtered = filtered.filter(item => item.source !== 'finite')
  }

  // 排序
  const sourceOrder = { roots: 0, classic: 1, borrowing: 2, finite: 3 }
  if (state.allwordsSort !== 'default') {
    const col = state.allwordsSort
    const dir = state.allwordsSortDir === 'asc' ? 1 : -1
    filtered.sort((a, b) => {
      let av, bv
      if (col === 'source') {
        av = sourceOrder[a.source] ?? 99
        bv = sourceOrder[b.source] ?? 99
        return (av - bv) * dir
      } else {
        av = (a[col] || '').toLowerCase()
        bv = (b[col] || '').toLowerCase()
        return av.localeCompare(bv, 'zh-CN') * dir
      }
    })
  }

  // 统计重复词语（仅对当前页做高亮，但统计范围是全部过滤后数据）
  const wordCount = {}
  filtered.forEach(item => {
    const w = (item.word || '').toLowerCase()
    wordCount[w] = (wordCount[w] || 0) + 1
  })
  const duplicateWords = new Set(Object.keys(wordCount).filter(w => wordCount[w] > 1))

  // 重复编码后缀已在 buildAllwordsList 中基于全量数据预计算，此处不再重新计算

  const p = paginate(filtered, state.allwordsPage)
  if (state.allwordsPage > p.totalPages && p.totalPages > 0) {
    state.allwordsPage = p.totalPages
    return renderAllwordsListTable()
  }

  let html = ''
  if (p.pageData.length === 0) {
    html += `<div class="empty-state">
      <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" stroke-width="2"/><line x1="14" y1="20" x2="34" y2="20" stroke="currentColor" stroke-width="1.5"/></svg>
      <p>暂无数据/</p>
    </div>`
  } else {
    html += `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>#</th><th>所有词唯一编码</th><th>词语</th><th>释义</th></tr></thead><tbody>`

    p.pageData.forEach((item, idx) => {
      const isDup = duplicateWords.has((item.word || '').toLowerCase())
      // 重复编码加后缀
      const codeDisplay = esc(item._codeDisplay || item.code)
      html += `<tr${isDup ? ' style="background:var(--gold-dim)"' : ''}>
        <td style="color:var(--text-muted);font-size:0.8rem">${p.start + idx + 1}</td>
        <td style="color:var(--accent);font-weight:600;font-size:0.82rem">${codeDisplay}</td>
        <td class="cell-word"${isDup ? ' style="color:var(--gold);font-weight:700"' : ''}>${esc(item.word)}</td>
        <td>${formatMeaningPOS(item.meaning)}</td>
      </tr>`
    })

    html += `</tbody></table></div></div>`
    html += renderPagination(p, state.allwordsPage, (newPage) => {
      state.allwordsPage = newPage
      renderAllwordsListTable()
    })
  }

  const target = document.getElementById('tableAreaAllwords')
  if (target) target.innerHTML = html
}

async function saveFiniteWord(id) {
  if (!await ensureAuth()) return

  const code = document.getElementById('formCode').value.trim()
  const wordVal = document.getElementById('formWord').value.trim()
  const record = {
    code: code,
    word: wordVal,
    pronunciation: document.getElementById('formPron').value.trim(),
    part_of_speech: document.getElementById('formPOS').value,
    meaning: document.getElementById('formMeaning').value.trim(),
    notes: document.getElementById('formNotes').value.trim(),
  }

  if (!record.code || !record.word || !record.meaning) {
    toast('词汇编码、词语和释义为必填项', 'error')
    return
  }

  const dupCode = checkDuplicate('finite', 'code', record.code, id)
  if (dupCode) { toast(`编码 "${record.code}" 已被词汇 "${dupCode.word}" 使用`, 'error'); return }

  const dupWord = checkDuplicate('finite', 'word', record.word, id)
  if (dupWord) { toast(`词语 "${record.word}" 已存在（编码: ${dupWord.code}）`, 'error'); return }

  try {
    if (id) {
      const { error } = await db.from('finite_words').update(record).eq('id', id)
      if (error) throw error
      toast('有限词汇已更新')
    } else {
      const { error } = await db.from('finite_words').insert([record])
      if (error) throw error
      toast('有限词汇已添加')
    }
    closeModal()
    updateFooterTime()
    await loadFiniteWords()
    renderFiniteTable()
  } catch (e) {
    toast('保存失败: ' + e.message, 'error')
  }
}

function deleteFiniteWord(id) {

function confirmExport(type) {

function exportXlsx(type) {
  if (typeof XLSX === 'undefined') { toast('xlsx 库加载中，请稍后再试', 'error'); return }

  let headers = []
  let rows = []
  let fileName = ''

  if (type === 'classic' || type === 'borrowing') {
    const list = type === 'classic' ? state.classicWords : state.borrowingWords
    headers = ['编码', '词语', '音标', '释义', '词类', '备注']
    rows = list.map(w => [
      w.code || '',
      w.word || '',
      w.pronunciation || '',
      w.meaning || '',
      w.part_of_speech || '',
      w.notes || ''
    ])
    fileName = ('田语' + type === 'classic' ? '古典词表' : '已收借词') 
                 + '_' + new Date().toISOString().replace('T', '_').slice(0, 16).replace(/:/g, '-') + '.xlsx'// 输出示例：古典词表_2026-07-08_06-30.xlsx（如果当前是北京时间14:30，这里会显示06-30）
  } else if (type === 'roots') {
    headers = ['编码', '音读词根', '形读词根', '核心义', '类别', '音读派生词', '备注']
    rows = state.roots.map(r => {
      let derivs = []
      try { derivs = JSON.parse(r.derivatives || '[]') } catch {}
      const derivStr = derivs.map(d => `${d.word}(${d.pos || ''})${d.meaning || ''}`).join('；')
      return [
        r.code || '',
        r.sound_root || '',
        r.form_root || '',
        r.core_meaning || '',
        r.category || '',
        derivStr,
        r.notes || ''
      ]
    })
    fileName = '田语' + '标准词根_' + new Date().toISOString().replace('T', '_').slice(0, 16).replace(/:/g, '-') + '.xlsx'
  } else if (type === 'allwords') {
    headers = ['编码', '词语', '释义']
    rows = buildAllwordsList().map(item => [
      item._codeDisplay || item.code || '',
      item.word || '',
      item.meaning || ''
    ])
    fileName = '田语' + '所有词表_' + new Date().toISOString().replace('T', '_').slice(0, 16).replace(/:/g, '-') + '.xlsx'
  } else if (type === 'finite') {
    headers = ['编码', '词语', '音标', '释义', '词性', '备注']
    rows = state.finiteWords.map(w => [
      w.code || '',
      w.word || '',
      w.pronunciation || '',
      w.meaning || '',
      w.part_of_speech || '',
      w.notes || ''
    ])
    fileName = '田语' + '有限词表_' + new Date().toISOString().replace('T', '_').slice(0, 16).replace(/:/g, '-') + '.xlsx'
  } else {
    toast('不支持的导出类型', 'error'); return
  }

  if (rows.length === 0) { toast('暂无数据可导出', 'error'); return }

  const aoa = [headers, ...rows]
  const ws = XLSX.utils.aoa_to_sheet(aoa)
  const wb = XLSX.utils.book_new()
  const sheetName = type === 'roots' ? '标准词根' : (type === 'classic' ? '古典词表' : (type === 'allwords' ? '所有词表' : (type === 'finite' ? '有限词表' : '已收借词')))
  XLSX.utils.book_append_sheet(wb, ws, sheetName.substring(0, 31))
  XLSX.writeFile(wb, fileName)
  toast(`已导出 ${rows.length} 条数据`)
}

async function saveWord(type, id) {
  // 增删改需口令验证
  if (!await ensureAuth()) return

  const isClassic = type === 'classic'
  const table = isClassic ? 'classic_words' : 'borrowing_words'

  const code = document.getElementById('formCode').value.trim()
  const wordVal = document.getElementById('formWord').value.trim()
  const record = {
    code: code,
    word: wordVal,
    pronunciation: document.getElementById('formPron').value.trim(),
    meaning: document.getElementById('formMeaning').value.trim(),
    notes: document.getElementById('formNotes').value.trim(),
  }

  // 必填验证
  if (!record.code || !record.word || !record.meaning) {
    toast('词汇编码、词语和释义为必填项', 'error')
    return
  }

  // 重复检测：编码
  const dupCode = checkDuplicate(type, 'code', record.code, id)
  if (dupCode) { toast(`编码 "${record.code}" 已被词汇 "${dupCode.word}" 使用`, 'error'); return }

  // 重复检测：词语
  const dupWord = checkDuplicate(type, 'word', record.word, id)
  if (dupWord) { toast(`词语 "${record.word}" 已存在（编码: ${dupWord.code}）`, 'error'); return }

  try {
    if (id) {
      const { error } = await db.from(table).update(record).eq('id', id)
      if (error) throw error
      toast('词汇已更新')
    } else {
      const { error } = await db.from(table).insert([record])
      if (error) throw error
      toast('词汇已添加')
    }
    closeModal()
    updateFooterTime()
    if (isClassic) { await loadClassicWords(); renderWordTable('classic') }
    else { await loadBorrowingWords(); renderWordTable('borrowing') }
  } catch (e) {
    toast('保存失败: ' + e.message, 'error')
  }
}

function addDerivativeRow() {

}

async function saveRoot(id) {
  // 增删改需口令验证
  if (!await ensureAuth()) return

  const derivSection = document.getElementById('derivSection')
  const derivRows = derivSection ? derivSection.querySelectorAll('.derivative-row') : []
  const derivatives = []
  derivRows.forEach(row => {
    const wordInput = row.querySelector('.deriv-word')
    const posSelect = row.querySelector('.deriv-pos')
    const meaningInput = row.querySelector('.deriv-meaning')
    const word = wordInput?.value?.trim()
    const pos = posSelect?.value || ''
    const meaning = meaningInput?.value?.trim()
    if (word) derivatives.push({ word, pos, meaning })
  })

  const code = document.getElementById('formCode').value.trim()
  const soundRoot = document.getElementById('formSoundRoot').value.trim()
  const record = {
    code: code,
    form_root: document.getElementById('formFormRoot').value.trim(),
    sound_root: soundRoot,
    core_meaning: document.getElementById('formCoreMeaning').value.trim(),
    category: document.getElementById('formCategory').value.trim(),
    derivatives: JSON.stringify(derivatives),
    notes: document.getElementById('formNotes').value.trim(),
  }

  // 必填验证
  if (!record.code || !record.sound_root || !record.core_meaning) {
    toast('编码、音读词根和核心义为必填项', 'error')
    return
  }

  // 重复检测：编码
  const dupCode = checkDuplicate('roots', 'code', record.code, id)
  if (dupCode) { toast(`编码 "${record.code}" 已被词根 "${dupCode.core_meaning}" 使用`, 'error'); return }

  // 重复检测：音读词根
  const dupSound = checkDuplicate('roots', 'sound_root', record.sound_root, id)
  if (dupSound) { toast(`音读词根 "${record.sound_root}" 已存在（编码: ${dupSound.code}）`, 'error'); return }

  // 重复检测：形读词根（若有值）
  if (record.form_root) {
    const dupForm = checkDuplicate('roots', 'form_root', record.form_root, id)
    if (dupForm) { toast(`形读词根 "${record.form_root}" 已存在（编码: ${dupForm.code}）`, 'error'); return }
  }

  // 重复检测：核心义
  const dupMeaning = checkDuplicate('roots', 'core_meaning', record.core_meaning, id)
  if (dupMeaning) { toast(`核心义 "${record.core_meaning}" 已存在（编码: ${dupMeaning.code}）`, 'error'); return }

  try {
    if (id) {
      const { error } = await db.from('roots').update(record).eq('id', id)
      if (error) throw error
      toast('词根已更新')
    } else {
      const { error } = await db.from('roots').insert([record])
      if (error) throw error
      toast('词根已添加')
    }
    closeModal()
    updateFooterTime()
    await loadRoots()
    renderRootsTab()
  } catch (e) {
    toast('保存失败: ' + e.message, 'error')
  }
}

function deleteRoot(id) {
  showConfirm('确定要删除这个词根吗？关联词汇的词根编码将变为空。', async () => {
    // 增删改需口令验证
    if (!await ensureAuth()) return

    try {
      const { error } = await db.from('roots').delete().eq('id', id)
      if (error) throw error
      toast('词根已删除')
      updateFooterTime()
      await loadRoots()
      renderRootsTab()
    } catch (e) {
      toast('删除失败: ' + e.message, 'error')
    }
  })
}

async function saveGrammar() {
  if (!state.currentGrammar) { toast('请先选择或新增一条语法', 'error'); return }
  if (!state.grammarTitle.trim()) { toast('请输入语法标题', 'error'); return }

  // 增删改需口令验证
  if (!await ensureAuth()) return

  try {
    const { error } = await db.from('grammar').update({
      title: state.grammarTitle.trim(),
      content: state.grammarContent,
    }).eq('id', state.currentGrammar.id)
    if (error) throw error
    toast('语法已保存')
    updateFooterTime()
    state.grammarDirty = false
    await loadGrammar()
    state.currentGrammar = state.grammarList.find(g => g.id === state.currentGrammar.id)
    renderGrammarTab()
  } catch (e) {
    toast('保存失败: ' + e.message, 'error')
  }
}

async function addGrammar() {
  const title = prompt('请输入新语法标题：')
  if (!title || !title.trim()) return

  // 增删改需口令验证
  if (!await ensureAuth()) return

  try {
    const maxOrder = state.grammarList.reduce((max, g) => Math.max(max, g.sort_order || 0), 0)
    const { data, error } = await db.from('grammar').insert([{
      title: title.trim(),
      content: '',
      sort_order: maxOrder + 1
    }]).select()
    if (error) throw error
    toast('语法条目已创建')
    updateFooterTime()
    await loadGrammar()
    if (data && data[0]) selectGrammar(data[0])
  } catch (e) {
    toast('创建失败: ' + e.message, 'error')
  }
}

function deleteGrammar(id) {

    // 增删改需口令验证
    if (!await ensureAuth()) return

    try {
      const { error } = await db.from('grammar').delete().eq('id', id)
      if (error) throw error
      toast('语法已删除')

      state.currentGrammar = state.grammarList.length > 0 ? state.grammarList[0] : null

// ---- 语法编辑器格式工具栏 ----
function getGrammarEditor() {
  return document.getElementById('grammarEditor')
}

function insertFormat(before, after, placeholder) {
  const ta = getGrammarEditor()
  if (!ta) return
  const start = ta.selectionStart
  const end = ta.selectionEnd
  const scrollTop = ta.scrollTop
  const text = ta.value
  const selected = text.substring(start, end) || placeholder
  ta.value = text.substring(0, start) + before + selected + after + text.substring(end)
  ta.focus()
  ta.selectionStart = start + before.length
  ta.selectionEnd = start + before.length + selected.length
  ta.scrollTop = scrollTop  // 修复：恢复滚动位置，防止滚到底部
  onGrammarContentChange(ta.value)
}

function insertLineStart(prefix) {
  const ta = getGrammarEditor()
  if (!ta) return
  const start = ta.selectionStart
  const scrollTop = ta.scrollTop
  const text = ta.value
  // 找到当前行开头
  let lineStart = start
  while (lineStart > 0 && text[lineStart - 1] !== '\n') lineStart--
  ta.value = text.substring(0, lineStart) + prefix + text.substring(lineStart)
  ta.focus()
  ta.selectionStart = ta.selectionEnd = lineStart + prefix.length + (start - lineStart)
  ta.scrollTop = scrollTop  // 修复：恢复滚动位置
  onGrammarContentChange(ta.value)
}

function insertLink() {
  const ta = getGrammarEditor()
  if (!ta) return
  const start = ta.selectionStart
  const end = ta.selectionEnd
  const scrollTop = ta.scrollTop
  const text = ta.value
  const selected = text.substring(start, end) || '链接文字'
  ta.value = text.substring(0, start) + '[' + selected + '](url)' + text.substring(end)
  ta.focus()
  const urlStart = start + selected.length + 3
  ta.selectionStart = urlStart
  ta.selectionEnd = urlStart + 3
  ta.scrollTop = scrollTop  // 修复：恢复滚动位置
  onGrammarContentChange(ta.value)
}

// 插入 Markdown 表格模板
function insertTable() {
  const ta = getGrammarEditor()
  if (!ta) return
  const start = ta.selectionStart
  const scrollTop = ta.scrollTop
  const template = '\n| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n'
  const text = ta.value
  ta.value = text.substring(0, start) + template + text.substring(start)
  ta.focus()
  ta.selectionStart = ta.selectionEnd = start + template.length
  ta.scrollTop = scrollTop
  onGrammarContentChange(ta.value)
}

// ==========================================
// PWA — Service Worker 注册与安装管理
// ==========================================
;(function initPWA() {
  // 检测是否支持 Service Worker
  if (!('serviceWorker' in navigator)) {
    console.log('[PWA] 浏览器不支持 Service Worker，以普通网页模式运行')
    return
  }

  let swRegistration = null
  let deferredPrompt = null

  // ---- 注册 Service Worker ----
  async function registerSW() {
    try {
      swRegistration = await navigator.serviceWorker.register('/dictionary/sw.js', {
        scope: '/dictionary/'
      })
      console.log('[PWA] Service Worker 注册成功，scope:', swRegistration.scope)

      // 监听 SW 更新
      swRegistration.addEventListener('updatefound', () => {
        const newWorker = swRegistration.installing
        if (!newWorker) return
        console.log('[PWA] 发现新版本 Service Worker')

        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 新 SW 已安装但等待激活，提示用户更新
            console.log('[PWA] 新版本已就绪，等待激活')
            showUpdateBanner()
          }
        })
      })

      // 定期检查更新（每 30 分钟）
      setInterval(() => {
        if (swRegistration) {
          swRegistration.update().catch(err => {
            console.warn('[PWA] 自动检查更新失败:', err.message)
          })
        }
      }, 30 * 60 * 1000)

      // 检测 controller 变化（新 SW 接管后）
      let refreshing = false
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return
        refreshing = true
        console.log('[PWA] Service Worker 已更新，页面即将刷新')
        window.location.reload()
      })

    } catch (err) {
      console.error('[PWA] Service Worker 注册失败:', err.message)
    }
  }

  // ---- 更新提示横幅 ----
  function showUpdateBanner() {
    const banner = document.getElementById('pwaUpdateBanner')
    if (!banner) return
    banner.style.display = 'flex'
  }

  function hideUpdateBanner() {
    const banner = document.getElementById('pwaUpdateBanner')
    if (banner) banner.style.display = 'none'
  }

  document.getElementById('btnUpdatePwa')?.addEventListener('click', () => {
    hideUpdateBanner()
    // 通知 SW 跳过等待，立即激活
    if (swRegistration?.waiting) {
      swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' })
    }
    // 延迟刷新，等待 skipWaiting 生效
    setTimeout(() => window.location.reload(), 300)
  })

  document.getElementById('btnCloseUpdate')?.addEventListener('click', hideUpdateBanner)

  // ---- 安装提示（beforeinstallprompt） ----
  window.addEventListener('beforeinstallprompt', (e) => {
    // 阻止浏览器默认安装提示
    e.preventDefault()
    // 保存事件对象
    deferredPrompt = e
    console.log('[PWA] beforeinstallprompt 事件已触发，可安装')

    // 显示自定义安装横幅
    const banner = document.getElementById('pwaInstallBanner')
    if (banner) banner.style.display = 'flex'

    // iOS 检测：显示添加到主屏幕引导
    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
      const iosGuide = document.getElementById('pwaIosGuide')
      if (iosGuide) {
        iosGuide.style.display = 'block'
        setTimeout(() => { iosGuide.style.display = 'none' }, 5000)
      }
    }
  })

  // 安装按钮点击
  document.getElementById('btnInstallPwa')?.addEventListener('click', async () => {
    if (!deferredPrompt) {
      toast('安装功能暂不可用，请稍后再试', 'info')
      return
    }
    // 显示安装提示
    deferredPrompt.prompt()
    const { outcome } = await deferredPrompt.userChoice
    console.log('[PWA] 用户安装选择:', outcome)
    deferredPrompt = null

    // 隐藏横幅
    const banner = document.getElementById('pwaInstallBanner')
    if (banner) banner.style.display = 'none'

    if (outcome === 'accepted') {
      toast('应用安装成功！', 'success')
    }
  })

  // 关闭安装横幅
  document.getElementById('btnDismissInstall')?.addEventListener('click', () => {
    const banner = document.getElementById('pwaInstallBanner')
    if (banner) banner.style.display = 'none'
    // 存储关闭时间，24小时内不再显示
    try {
      localStorage.setItem('pwa_install_dismissed', Date.now().toString())
    } catch {}
  })

  // 检测是否已安装（standalone 模式）
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
      navigator.standalone ||
      document.referrer.includes('android-app://')
  }

  // 如果已安装，不显示安装横幅
  if (isStandalone()) {
    console.log('[PWA] 检测到已安装（standalone 模式），跳过安装提示')
    const banner = document.getElementById('pwaInstallBanner')
    if (banner) banner.style.display = 'none'
  } else {
    // 检查 24 小时内是否已关闭
    try {
      const dismissed = localStorage.getItem('pwa_install_dismissed')
      if (dismissed && (Date.now() - parseInt(dismissed)) < 24 * 60 * 60 * 1000) {
        console.log('[PWA] 24 小时内已关闭安装提示，跳过')
      }
    } catch {}
  }

  // 监听 display-mode 变化（用户从浏览器切换到已安装的 PWA）
  window.matchMedia('(display-mode: standalone)').addEventListener('change', (e) => {
    if (e.matches) {
      console.log('[PWA] 检测到应用已安装')
      const banner = document.getElementById('pwaInstallBanner')
      if (banner) banner.style.display = 'none'
    }
  })

  // ---- 手动检查更新按钮（暴露到全局） ----
  window.checkPwaUpdate = async function () {
    if (!swRegistration) {
      toast('Service Worker 未注册', 'error')
      return
    }
    try {
      await swRegistration.update()
      toast('已检查更新', 'info')
    } catch (err) {
      toast('检查更新失败: ' + err.message, 'error')
    }
  }

  // ---- 启动 ----
  registerSW()
})()

// ---- 键盘快捷操作 ----
document.addEventListener('keydown', (e) => {
  // 在输入框内时不触发快捷键（Esc 除外）
  const tag = document.activeElement?.tagName
  const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'

  // Alt+1~4：切换标签页
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    const tabMap = { '2': 'classic', '1': 'roots', '3': 'borrowing', '4': 'allwords', '5': 'finite', '6': 'grammar' }
    const tab = tabMap[e.key]
    if (tab) {
      e.preventDefault()
      switchTab(tab)
      return
    }
  }

  // Esc：关闭弹窗/认证对话框
  if (e.key === 'Escape') {
    // 优先关闭认证对话框
    if (authOverlay.style.display === 'flex') {
      e.preventDefault()
      authOverlay.style.display = 'none'
      if (window._authResolve) { window._authResolve(false); window._authResolve = null }
      return
    }
    // 关闭编辑弹窗
    if (modalContainer.innerHTML) {
      e.preventDefault()
      closeModal()
      return
    }
    // 关闭确认对话框
    if (confirmContainer.innerHTML) {
      e.preventDefault()
      confirmContainer.innerHTML = ''
      return
    }
  }

  // 在输入框内时，以下快捷键不触发
  if (isInput) {
    // Enter 键在非 textarea 输入框内触发保存
    if (e.key === 'Enter' && tag !== 'TEXTAREA' && modalContainer.innerHTML) {
      e.preventDefault()
      triggerModalSave()
    }
    return
  }

  // Ctrl+N：新增（根据当前标签页）
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.key === 'n') {
    e.preventDefault()
    if (state.currentTab === 'classic') openWordModal('classic', null)
    else if (state.currentTab === 'borrowing') openWordModal('borrowing', null)
    else if (state.currentTab === 'roots') openRootModal(null)
    else if (state.currentTab === 'finite') openFiniteWordModal(null)
    else if (state.currentTab === 'grammar') addGrammar()
    return
  }

  // Ctrl+F：聚焦搜索框
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.key === 'f') {
    e.preventDefault()
    const searchId = state.currentTab === 'roots' ? 'searchRoots'
      : state.currentTab === 'allwords' ? 'searchAllwords'
      : 'search' + state.currentTab
    const searchInput = document.getElementById(searchId)
    if (searchInput) searchInput.focus()
    return
  }
})

}
